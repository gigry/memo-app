<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>メモ帳</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 2em; text-align: center; }
    textarea { width: 90%; height: 200px; }
    button { margin: 1em; padding: 0.5em 1em; }
  </style>
</head>
<body>
  <h1>メモ帳</h1>
  <textarea id="memo" placeholder="ここにメモを入力..."></textarea><br>
  <button onclick="save()">保存</button>
  <button onclick="clearMemo()">リセット</button>
  <button onclick="exportMemo()">書き出し</button>

  <script>
    const memo = document.getElementById("memo");
    memo.value = localStorage.getItem("memo") || "";

    function save() {
      localStorage.setItem("memo", memo.value);
      alert("保存しました！");
    }

    function clearMemo() {
      memo.value = "";
      localStorage.removeItem("memo");
    }

    function exportMemo() {
      if (!memo.value) {
        alert("メモが空です");
        return;
      }
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
      const blob = new Blob([memo.value], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `memo-${stamp}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
